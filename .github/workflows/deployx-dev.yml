# Generated by DeployX for ParkingApi / Development.
# Regenerate it from DeployX instead of editing it by hand.
name: 'DeployX · ParkingApi · Development'

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'deployx-01a0d678ad997334b071af65f6c3408f-dev'
  cancel-in-progress: false

env:
  DEPLOYX_URL: 'http://localhost:5110'
  DEPLOYX_PROJECT: '01a0d678-ad99-7334-b071-af65f6c3408f'
  DEPLOYX_ENVIRONMENT: 'dev'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 'Setup .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: 'Restore'
        run: |
          dotnet restore 'ParkingApi.sln'
      - name: 'Build'
        run: |
          dotnet build 'ParkingApi.sln' -c Release --no-restore
      - name: 'Publish'
        run: |
          dotnet publish 'ParkingApi.csproj' -c Release -o publish --no-build
      - name: 'Create artifact'
        run: |
          cd publish && zip -qr "$GITHUB_WORKSPACE/artifact.zip" .
      - name: Deploy with DeployX
        working-directory: ${{ github.workspace }}
        env:
          DEPLOYX_TOKEN: ${{ secrets.DEPLOYX_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          resp="$(curl -sS --fail-with-body -H "Authorization: Bearer $DEPLOYX_TOKEN" \
            -F "file=@artifact.zip" \
            --form-string "commitSha=$GITHUB_SHA" \
            --form-string "branch=$GITHUB_REF_NAME" \
            --form-string "buildId=$GITHUB_RUN_ID" \
            --form-string "releaseNotes=${COMMIT_MESSAGE:-}" \
            --form-string "environment=$DEPLOYX_ENVIRONMENT" \
            "$DEPLOYX_URL/api/ci/projects/$DEPLOYX_PROJECT/deployments")"
          id="$(jq -r .deploymentId <<<"$resp")"
          echo "DeployX: $(jq -r .version <<<"$resp") → $(jq -r .environment <<<"$resp") (deployment #$(jq -r .number <<<"$resp"))"
          seen=""
          for _ in $(seq 1 360); do
            state="$(curl -sS --fail-with-body -H "Authorization: Bearer $DEPLOYX_TOKEN" "$DEPLOYX_URL/api/ci/deployments/$id")"
            # Key by position: rollback repeats step names ("Restart service") that must still be printed.
            while IFS=$'\t' read -r key line; do
              case "$seen" in *"|$key|"*) ;; *) echo "  $line"; seen="$seen|$key|" ;; esac
            done < <(jq -r '.steps | to_entries[] | select(.value.status != "Pending" and .value.status != "Running")
                            | "\(.key)\t\(.value.name): \(.value.status)"' <<<"$state")
            status="$(jq -r .status <<<"$state")"
            case "$status" in
              Succeeded) echo "✓ $(jq -r .version <<<"$state") is live on $(jq -r .environment <<<"$state")"; exit 0 ;;
              AwaitingApproval) echo "::notice::Deployment is waiting for approval in DeployX."; exit 0 ;;
              Failed|RolledBack|Cancelled)
                echo "::error::Deployment $status: $(jq -r '.error // ""' <<<"$state")"
                jq -r '.steps[] | select(.error != null) | "  \(.name): \(.error)"' <<<"$state"
                exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::Timed out waiting for DeployX"; exit 1
